name: Verify Telegram Draft
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: job-hunter-applications
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - name: Verify draft delivery and review only
        run: |
          python - <<'PY'
          from proposal_writer import make_proposal
          from telegram_approval import approve
          lead = {
              "title": "Frontend разработчик (Junior) — IT HUB",
              "url": "https://remote-job.ru/vacancy/show/657106/frontend-razrabotchik-junior",
              "description": "JavaScript ES6+, TypeScript, React. Без опыта.",
              "source": "remote_job_ru",
          }
          draft = make_proposal(lead)
          lead["title"] = "ПРОВЕРКА TELEGRAM: " + lead["title"]
          notice = ("Проверка доставки и кнопок. В этом запуске отклик работодателю "
                    "НЕ отправляется даже после подтверждения.\n\n")
          approved = approve(lead, notice + draft)
          print("Review result:", "APPROVED" if approved else "NOT_APPROVED")
          print("Employer applications sent: 0 (draft-only workflow)")
          PY
