name: Verify HH Auto Apply

on:
  push:
    paths:
      - ".github/workflows/verify-hh-apply.yml"
      - "browser_apply.py"
      - "proposal_writer.py"
      - "profit_ranker.py"
      - "hh_web_search.py"
      - "worker.py"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python syntax without sending applications
        run: |
          python -m py_compile browser_apply.py proposal_writer.py profit_ranker.py hh_web_search.py worker.py
