name: HH Read-only Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - "hh_diagnostics.py"
      - ".github/workflows/hh-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: hh-read-only-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HH_STORAGE_STATE_JSON: ${{ secrets.HH_STORAGE_STATE_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check HH API and saved login without applying
        run: python hh_diagnostics.py
