name: Search Junior React Now

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/search-junior-react-now.yml"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HH_STORAGE_STATE_JSON: ${{ secrets.HH_STORAGE_STATE_JSON }}
      RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Search and report without sending applications
        run: |
          python - <<'PY'
          import json
          from worker import collect_all, apply_resume_matching, prioritize_actionable_leads, is_freelance, COLLECTION_ERRORS
          from profit_ranker import rank_leads, _role_category

          leads = apply_resume_matching(collect_all())
          ranked = prioritize_actionable_leads(rank_leads(leads))
          jobs = [lead for lead in ranked if not is_freelance(lead)]
          react = [lead for lead in jobs if _role_category(lead) == "frontend" and "react" in str(lead.get("title") or "").lower()]
          frontend = [lead for lead in jobs if _role_category(lead) == "frontend" and lead not in react]
          def summary(lead):
              return {key: lead.get(key) for key in ("title", "company", "source", "url", "salary", "location", "published", "description", "profit_score")}
          print("SEARCH_RESULT_JSON=" + json.dumps({
              "found": len(leads), "eligible": len(jobs), "junior_react": [summary(x) for x in react[:20]],
              "other_junior_frontend": [summary(x) for x in frontend[:10]],
              "collection_errors": COLLECTION_ERRORS, "applications_sent": 0,
          }, ensure_ascii=False, default=str), flush=True)
          PY
