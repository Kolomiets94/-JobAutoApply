name: Hourly Job Hunter

on:
  schedule:
    - cron: "0 1,3,5,7,9 * * *" # 06:00,08:00,10:00,12:00,14:00 Yekaterinburg
  workflow_dispatch:

concurrency:
  group: job-hunter-applications
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
      SUPERJOB_API_KEY: ${{ secrets.SUPERJOB_API_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MATCH_NOTIFY_MIN_SCORE: "70"
      AUTO_FREELANCE_APPLY: "1"
      FREELANCEHUNT_TOKEN: ${{ secrets.FREELANCEHUNT_TOKEN }}
      AUTO_SEND_EMAIL: "1"
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      AUTO_BROWSER_APPLY: "1"
      REMOTE_JOB_NAME: ${{ secrets.REMOTE_JOB_NAME }}
      REMOTE_JOB_EMAIL: ${{ secrets.SMTP_USER }}
      REMOTE_JOB_PHONE: ${{ secrets.REMOTE_JOB_PHONE }}
      HH_STORAGE_STATE_JSON: ${{ secrets.HH_STORAGE_STATE_JSON }}
      DAILY_JOB_LIMIT: "10"
      DAILY_FREELANCE_LIMIT: "10"
      HOURLY_JOB_LIMIT: "2"
      HOURLY_FREELANCE_LIMIT: "2"
      HUNTER_DB: hunter.db
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Restore hunter history
        uses: actions/cache/restore@v4
        with:
          path: hunter.db
          key: hunter-db-${{ github.run_id }}
          restore-keys: |
            hunter-db-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run hunter
        run: python worker.py

      - name: Save hunter history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hunter.db
          key: hunter-db-${{ github.run_id }}
