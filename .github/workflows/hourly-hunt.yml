name: Hourly Job Hunter

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    env:
      RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MATCH_NOTIFY_MIN_SCORE: "70"
      AUTO_BROWSER_APPLY: ${{ secrets.AUTO_BROWSER_APPLY }}
      HH_STORAGE_STATE_JSON: ${{ secrets.HH_STORAGE_STATE_JSON }}
      DAILY_APPLICATION_LIMIT: "10"
      HUNTER_DB: hunter.db
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Restore hunter history
        uses: actions/cache/restore@v4
        with:
          path: hunter.db
          key: hunter-db-${{ github.run_id }}
          restore-keys: |
            hunter-db-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run hunter
        run: python worker.py

      - name: Save hunter history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hunter.db
          key: hunter-db-${{ github.run_id }}
